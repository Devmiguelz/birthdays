<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Cumpleaños Familia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">

<!-- ── ICONO (globos) + PWA ── -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='112'%20fill='%231A1530'/%3E%3Cg%20fill='none'%20stroke='%23F0EAF8'%20stroke-width='7'%20stroke-linecap='round'%20opacity='.75'%3E%3Cpath%20d='M258%20330%20Q252%20385%20256%20432'/%3E%3Cpath%20d='M188%20286%20Q212%20372%20256%20432'/%3E%3Cpath%20d='M324%20240%20Q300%20345%20256%20432'/%3E%3C/g%3E%3Cellipse%20cx='258'%20cy='250'%20rx='66'%20ry='80'%20fill='%23FFC107'/%3E%3Cpath%20d='M248%20327%20L268%20327%20L258%20347Z'%20fill='%23FFC107'/%3E%3Cellipse%20cx='238'%20cy='226'%20rx='17'%20ry='26'%20fill='%23fff'%20opacity='.3'/%3E%3Cellipse%20cx='188'%20cy='190'%20rx='80'%20ry='96'%20fill='%23E91E8C'/%3E%3Cpath%20d='M176%20283%20L200%20283%20L188%20305Z'%20fill='%23E91E8C'/%3E%3Cellipse%20cx='160'%20cy='160'%20rx='21'%20ry='33'%20fill='%23fff'%20opacity='.28'/%3E%3Cellipse%20cx='324'%20cy='150'%20rx='74'%20ry='90'%20fill='%2300BCD4'/%3E%3Cpath%20d='M313%20237%20L335%20237%20L324%20258Z'%20fill='%2300BCD4'/%3E%3Cellipse%20cx='300'%20cy='122'%20rx='19'%20ry='29'%20fill='%23fff'%20opacity='.28'/%3E%3C/svg%3E">
<meta name="theme-color" content="#2D1B69">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cumpleaños">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
<script src="app.js" defer></script>

<!-- ── PWA: manifest + iconos + service worker (todo autocontenido) ── -->




<!-- Three.js canvas for celebration -->
<canvas id="three-canvas"></canvas>

<!-- HEADER -->
<div class="app-header">
  <div class="header-glow"></div>
  <div class="header-inner">
    <div class="header-brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/>
          <circle cx="12" cy="9" r="2.5" fill="#fff" stroke="none"/>
          <path d="M8 22h8M10 2c0 0-1-2 2-2s2 2 2 2" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="app-title">Cumpleaños</div>
    </div>
    <div class="header-date-pill" id="header-date"></div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" data-view="swipe">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="14" height="18" rx="3"/>
      <rect x="8" y="2" width="14" height="18" rx="3"/>
    </svg>
    Tarjetas
  </button>
  <button class="tab" data-view="list">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"/>
      <line x1="8" y1="12" x2="21" y2="12"/>
      <line x1="8" y1="18" x2="21" y2="18"/>
      <circle cx="3" cy="6" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="3" cy="12" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="3" cy="18" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
    Lista
  </button>
  <button class="tab" data-view="calendar">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="3"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    Calendario
  </button>
</div>

<!-- SWIPE VIEW -->
<div class="view active" id="view-swipe">
  <div id="bday-banner" class="bday-banner" hidden>
    <div class="banner-icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3C9 3 6 5.5 6 9c0 1.5.6 2.9 1.5 4H4l1 9h14l1-9h-3.5C17.4 11.9 18 10.5 18 9c0-3.5-3-6-6-6z"/>
        <line x1="12" y1="3" x2="12" y2="1"/>
        <path d="M9 3C9 3 8 1 9.5 1S11 3 11 3"/>
        <path d="M15 3C15 3 16 1 14.5 1S13 3 13 3"/>
      </svg>
    </div>
    <div class="banner-text">
      <div class="banner-title" id="banner-title"></div>
      <div class="banner-sub">¡Hoy es su día especial!</div>
    </div>
  </div>

  <div class="swipe-label">Próximos cumpleaños</div>
  <div class="deck-wrap" id="deck-wrap"></div>
  <div class="deck-nav">
    <button class="nav-btn" id="btn-prev" title="Anterior">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="deck-counter" id="deck-counter"></div>
    <button class="nav-btn" id="btn-next" title="Siguiente">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="deck-dots" id="deck-dots"></div>
</div>

<!-- LIST VIEW -->
<div class="view" id="view-list">
  <div class="up-list" id="up-list"></div>
</div>

<!-- CALENDAR VIEW -->
<div class="view" id="view-calendar">
  <div id="cal-featured"></div>
  <div class="cal-other-label" id="cal-other-label">Otros meses</div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- MONTH MODAL -->
<div class="month-overlay" id="month-modal" hidden>
  <div class="month-modal">
    <div class="month-modal-head" id="mm-head">
      <div>
        <div class="month-modal-title" id="mm-title"></div>
        <div class="month-modal-year" id="mm-year"></div>
      </div>
      <button class="month-modal-close" id="mm-close">
        <svg viewBox="0 0 24 24" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="mini-cal">
      <div class="mini-cal-dow" id="mm-dow"></div>
      <div class="mini-cal-days" id="mm-days"></div>
    </div>
    <div id="mm-list"></div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="modal" hidden>
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-av" id="m-av"></div>
      <div>
        <div class="modal-name" id="m-name"></div>
        <div class="modal-sub"  id="m-sub"></div>
      </div>
    </div>
    <textarea id="m-msg" rows="4"></textarea>
    <div class="modal-btns">
      <button class="mbt" id="btn-cancel">Cancelar</button>
      <button class="mbt mbt-cp" id="btn-copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copiar
      </button>
      <a class="mbt mbt-wa" id="btn-wa" href="#" target="_blank">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </a>
    </div>
  </div>
</div>

<!-- ADMIN FLOATING BUTTON -->
<button id="admin-fab" title="Administrar cumpleaños">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>
<div id="admin-toast"></div>

<!-- ADMIN MODAL -->
<div class="overlay" id="admin-modal" hidden>
  <div class="modal admin-box">
    <div class="admin-head">
      <div class="modal-name">Administrar</div>
      <button class="month-modal-close" id="admin-close" style="background:var(--surface2)">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke="var(--fg)"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Token -->
    <div class="admin-token" id="admin-token-box">
      <div class="admin-token-status" id="admin-token-status"></div>
      <div id="admin-token-form">
        <input type="password" id="admin-token-input" placeholder="Pega aquí tu token de GitHub" autocomplete="off">
        <div class="admin-token-actions">
          <button class="mbt mbt-cp" id="admin-token-save">Guardar token</button>
          <button class="mbt" id="admin-token-clear" hidden>Olvidar token</button>
        </div>
        <div class="admin-help">
          El token se guarda solo en este dispositivo. Necesita permiso <b>Contents: Read&nbsp;and&nbsp;write</b> en el repo <b>birthdays</b>.
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="admin-form" id="admin-form">
      <div class="admin-form-title" id="admin-form-title">Añadir persona</div>
      <div class="admin-grid">
        <label>Nombre<input type="text" id="f-name" placeholder="Nombre completo"></label>
        <label>Apodo<input type="text" id="f-nick" placeholder="Apodo"></label>
        <label>Fecha<input type="date" id="f-date"></label>
        <label>Teléfono<input type="text" id="f-phone" placeholder="57300... (opcional)"></label>
        <label class="admin-noyear"><input type="checkbox" id="f-noyear"> Sin año (no mostrar edad)</label>
      </div>
      <div class="admin-form-btns">
        <button class="mbt" id="admin-form-cancel" hidden>Cancelar edición</button>
        <button class="mbt mbt-cp" id="admin-form-save">Guardar persona</button>
      </div>
    </div>

    <!-- List -->
    <div class="admin-list" id="admin-list"></div>

    <!-- Sync -->
    <div class="admin-sync">
      <button class="mbt mbt-cp" id="admin-sync-btn" disabled>
        <span id="admin-sync-dot" class="admin-sync-dot" hidden></span>
        <span id="admin-sync-label">Sincronizar cambios</span>
      </button>
    </div>
    <div class="admin-status" id="admin-status"></div>
  </div>
</div>





</body></html>
